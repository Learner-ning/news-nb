<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1322">
  <title>新闻树 · NOW News Tree</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-theme="night">
  <!-- 背景（仅环境，不含树）：可换预设主题或用户上传图片 -->
  <div id="bg" aria-hidden="true">
    <div class="bg-photo" id="bg-photo"></div>
    <div class="aurora"></div>
    <div class="stars" id="bg-stars"></div>
    <div class="vignette"></div>
  </div>

  <!-- 顶部：极简 -->
  <header class="topbar">
    <button id="brand" class="brand" title="回到首页">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M12 3c3.2 0 6 1.2 8 3.2l-1.7 1.7A8.6 8.6 0 0 0 12 5.2c-3 0-5.6 1.5-7 3.8h3.2v2.4H3.3A9 9 0 0 1 3 12a9 9 0 0 0 18 0h2A11 11 0 0 1 12 23 11 11 0 0 1 1 12a9.9 9.9 0 0 1 .4-2.8H0V6.8h4.1C5.7 4.4 8.6 3 12 3Z" fill="currentColor"/>
      </svg>
      <span>NOW<span class="dot">·</span>新闻树</span>
    </button>
    <div class="top-status" id="top-status" title="最近一次数据更新">正在连接…</div>
    <button id="bg-btn" class="icon-btn" title="背景与外观设置" aria-label="背景设置">🎨</button>
    <button id="refresh" class="icon-btn" title="立即刷新数据" aria-label="刷新数据">↻</button>
  </header>

  <!-- 背景设置面板 -->
  <div id="bg-settings" class="bg-settings hidden" role="dialog" aria-label="背景设置">
    <div class="bs-head">
      <b>背景与外观</b>
      <button class="bs-x" id="bg-settings-close" aria-label="关闭">✕</button>
    </div>

    <div class="bs-sec">
      <div class="bs-label">预设主题</div>
      <div class="bs-themes">
        <button class="bs-theme" data-theme="night">🌙 深色沉浸</button>
        <button class="bs-theme" data-theme="dawn">🌄 明亮晨曦</button>
        <button class="bs-theme" data-theme="ocean">🌊 深海蓝调</button>
      </div>
    </div>

    <div class="bs-sec">
      <div class="bs-label">自定义背景图片（覆盖预设）</div>
      <div class="bs-row">
        <button class="btn-ghost" id="bg-upload-btn" type="button">上传图片</button>
        <input type="file" id="bg-file" accept="image/*" hidden>
        <div class="bs-or">或</div>
        <input type="text" id="bg-url-input" placeholder="粘贴图片 URL（https://…）" spellcheck="false">
        <button class="btn-ghost" id="bg-url-apply" type="button">应用</button>
      </div>
      <div id="bg-photo-state" class="bs-state hidden">
        已使用自定义背景 <button class="linklike" id="bg-photo-remove" type="button">移除</button>
      </div>
    </div>

    <div class="bs-sec">
      <div class="bs-label">背景压暗 <span class="bs-val" id="dim-val">35%</span></div>
      <input type="range" id="bg-dim" min="0" max="80" value="35" step="5">
      <div class="bs-hint">压暗越多，树与文字越清晰（有背景图片时也有效）</div>
    </div>
  </div>

  <main id="stage">
    <!-- ======== 树模式 ======== -->
    <section id="view-tree" class="view tree-view" aria-label="新闻树视图">
      <svg id="tree-svg" role="img" aria-label="交互式新闻树">
        <defs>
          <radialGradient id="leaf-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="trunk-grad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#5a3a20"/>
            <stop offset="55%" stop-color="#8a5a30"/>
            <stop offset="100%" stop-color="#b07644"/>
          </linearGradient>
        </defs>
        <g id="world">
          <!-- 树被渲染到这里：树干/主枝/分枝/新闻叶片 -->
        </g>
      </svg>

      <!-- 右下：缩放控制 -->
      <div class="zoom-dock" role="group" aria-label="缩放控制">
        <button id="zoom-in" class="icon-btn" title="放大">＋</button>
        <button id="zoom-out" class="icon-btn" title="缩小">－</button>
        <button id="zoom-fit" class="icon-btn wide" title="重新定位 / 自适应">⤢ 适应</button>
        <button id="zoom-reset" class="icon-btn" title="重置视图">⟲</button>
      </div>

      <!-- 悬停新闻详情卡（跟随节点附近，不占屏幕中央） -->
      <div id="hover-card" class="hover-card hidden" aria-hidden="true">
        <div class="hc-top">
          <span class="hc-chip" id="hc-chip"></span>
          <span class="hc-time" id="hc-time"></span>
        </div>
        <div class="hc-title" id="hc-title"></div>
        <div class="hc-heat" id="hc-heat"></div>
        <div class="hc-summary" id="hc-summary"></div>
        <div class="hc-actions">
          <button class="hc-open" id="hc-open">查看详情 →</button>
        </div>
      </div>

      <div class="tree-hint" id="tree-hint">拖动移动 · 滚轮/捏合缩放 · 悬停叶片看新闻 · 点击进详情</div>
    </section>

    <!-- ======== 列表模式 ======== -->
    <section id="view-list" class="view list-view hidden" aria-label="新闻列表视图">
      <div class="lv-head">
        <div class="lv-title" id="list-title">全部新闻</div>
        <div class="lv-sorts" role="group" aria-label="列表排序">
          <button class="sort-pill active" data-sort="heat">热度</button>
          <button class="sort-pill" data-sort="time">时间</button>
        </div>
        <div class="lv-meta" id="list-meta"></div>
      </div>
      <div id="news-list" class="news-list"></div>
    </section>

    <!-- ======== 热榜模式 ======== -->
    <section id="view-board" class="view board-view hidden" aria-label="全站热榜">
      <div class="lv-head">
        <div class="lv-title">🔥 全站热榜</div>
        <div class="lv-meta" id="board-meta"></div>
      </div>
      <div id="board-list" class="board-list"></div>
    </section>

    <!-- ======== 详情视图 ======== -->
    <section id="view-detail" class="view detail-view hidden" aria-label="新闻详情">
      <button id="back-btn" class="back-btn">← 返回</button>
      <article class="detail" id="detail-content">
        <div class="skeleton detail-skeleton"></div>
      </article>
    </section>

    <!-- 左侧：显示方式（树 / 列表 / 热榜，可折叠，全局可见） -->
    <div class="left-dock" role="group" aria-label="显示方式" id="left-dock">
      <div class="dock-head">
        <div class="dock-title">显示方式</div>
        <button id="dock-collapse" class="dock-toggle" title="折叠面板" aria-label="折叠显示方式面板">‹</button>
      </div>
      <button class="dock-btn active" data-mode="tree" title="以新闻树方式浏览">
        <span class="db-ico">◧</span><span>新闻树</span>
      </button>
      <button class="dock-btn" data-mode="list" title="以新闻列表方式浏览">
        <span class="db-ico">☰</span><span>新闻列表</span>
      </button>
      <button class="dock-btn" data-mode="board" title="全站热榜">
        <span class="db-ico">🔥</span><span>热榜</span>
      </button>
    </div>

    <!-- 折叠后的展开按钮（悬停在屏幕左缘） -->
    <button id="dock-reopen" class="dock-reopen hidden" title="展开显示方式面板" aria-label="展开显示方式面板">
      <span class="dr-ico">☰</span>
      <span class="dr-txt">显示方式</span>
    </button>
  </main>

  <!-- 底部：真实分类导航 -->
  <nav id="cat-bar" class="cat-bar" aria-label="新闻分类">
    <span class="cat-bar-hint">分类</span>
    <div class="cat-scroll" id="cat-scroll"></div>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
