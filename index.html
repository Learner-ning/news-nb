<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>新闻树 · 沉浸探索</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="bg-layer"></div>
  <div id="bg-mask"></div>
  <canvas id="scene-canvas"></canvas>

  <!-- 枝叶新闻卡片 -->
  <div id="news-card" class="news-card" aria-live="polite">
    <div class="nc-chip" id="nc-chip"></div>
    <div class="nc-title" id="nc-title"></div>
    <div class="nc-meta" id="nc-meta"></div>
    <div class="nc-summary" id="nc-summary"></div>
    <div class="nc-imp"><span class="imp-label">重要度</span><span id="nc-imp"></span></div>
    <div class="nc-actions">
      <button id="nc-detail">查看详情</button>
      <a id="nc-link" href="#" target="_blank" rel="noopener noreferrer">原文 ↗</a>
      <button id="nc-close" aria-label="关闭">✕</button>
    </div>
  </div>

  <!-- 详情覆盖层 -->
  <div id="detail-overlay" class="detail-overlay hidden">
    <div class="detail-panel">
      <button id="detail-close" class="detail-close" aria-label="关闭">✕</button>
      <div class="detail-chip" id="detail-chip"></div>
      <h2 class="detail-title" id="detail-title"></h2>
      <div class="detail-meta" id="detail-meta"></div>
      <p class="detail-summary" id="detail-summary"></p>
      <div class="detail-actions">
        <a id="detail-link" href="#" target="_blank" rel="noopener noreferrer" class="detail-link-btn">阅读原文 ↗</a>
      </div>
    </div>
  </div>

  <!-- 左下：昼夜切换 -->
  <button id="daynight-btn" class="ctl-btn" title="切换昼夜">
    <span class="dn-icon" id="dn-icon">🌙</span><span class="dn-label" id="dn-label">夜晚</span>
  </button>

  <!-- 右下：显示方式 -->
  <div class="mode-pill" id="mode-pill">
    <span class="mode-title">显示方式</span>
    <button class="mode-opt active" data-mode="pin">固定</button>
    <button class="mode-opt" data-mode="follow">跟随</button>
  </div>

  <!-- 右上：背景设置 -->
  <button id="settings-btn" class="ctl-btn settings-btn" title="背景设置">⚙</button>
  <div id="settings-panel" class="settings-panel hidden">
    <div class="sp-title">背景设置</div>
    <button class="sp-opt" data-bg="scene-night">🌙 默认黑夜草原</button>
    <button class="sp-opt" data-bg="scene-day">☀️ 默认白天草原</button>
    <div class="sp-row">
      <input type="text" id="bg-image-input" placeholder="自定义图片 URL" spellcheck="false">
      <button id="bg-image-apply">应用</button>
    </div>
    <div class="sp-row">
      <input type="color" id="bg-color-input" value="#0b1220">
      <button id="bg-color-apply">纯色</button>
    </div>
    <div class="sp-row">
      <input type="text" id="bg-video-input" placeholder="视频背景 URL（预留）" spellcheck="false">
      <button id="bg-video-apply">视频</button>
    </div>
  </div>

  <div id="hint" class="hint">移动鼠标探索新闻树 · 靠近枝叶查看新闻 · 点击固定 · 双击进入详情</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
